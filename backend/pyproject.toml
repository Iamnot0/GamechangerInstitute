[project]
name = "gci-backend"
version = "1.0.0"
description = "GameChanger Institute enquiries API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib~=5.1",
    "alembic~=1.20",
    "asyncpg~=0.32.0",
    "email-validator~=2.4",
    "fastapi~=0.165.0",
    "httpx~=0.28.1",
    "pydantic~=2.14",
    "pyjwt[crypto]~=2.15",
    "pydantic-settings~=2.16",
    "redis~=8.1",
    "sqlalchemy[asyncio]~=2.1",
    "uvicorn[standard]~=0.54.0",
]

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PL", "N"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
